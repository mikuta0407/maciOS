# Builds an unsigned maciOS.ipa, guest root included, for sideloading.
# A pushed v* tag publishes it as a GitHub release; a manual run keeps it
# as a workflow artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    # The project needs Xcode 27 (the iOS 27 SDK).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The guest root is made from Homebrew bottles (GuestRoot/build-root.sh).
      - name: Check Homebrew
        run: brew --version

      - name: Build the ipa
        run: scripts/build-ipa.sh build

      - uses: actions/upload-artifact@v4
        with:
          name: maciOS.ipa
          path: build/maciOS.ipa

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/maciOS.ipa --title "$GITHUB_REF_NAME" --generate-notes
